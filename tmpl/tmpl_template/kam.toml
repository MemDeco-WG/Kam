[prop]
id = "tmpl_template"
name = "Kam Template Template"
version = "0.1.0"
versionCode = 1  # Will be auto-generated as timestamp during initialization
author = "LightJunction"
description = "A Kam template for creating custom Kam templates"
updateJson = ""
metamodule = false

[mmrl.repo]
license = "MIT"
license_file = "LICENSE"
homepage = ""
readme = ""
readme_file = "README.md"
changelog = ""
changelog_file = "CHANGELOG.md"
screenshots = []
categories = ["tools"]
keywords = [
    "kam",
    "template",
    "android",
    "template-template",
]
maintainers = ["LightJunction"]
repository = ""
documentation = ""
issues = ""
funding = "https://github.com/sponsors/LightJunction"
support = ""
donate = ""
cover = ""
icon = "icon.png"
devices = []
arch = ["arm64-v8a"]
require = []
antifeatures = []
max_num = 0
min_api = 21
max_api = 35
verified = false
features = [
    "template",
    "template-template",
    "customization",
]

[mmrl.repo.note]
title = ""
message = ""

[mmrl.repo.manager.magisk]
devices = []
arch = []
require = []

[mmrl.repo.manager.kernelsu]
devices = []
arch = []
require = []

[mmrl.repo.manager.apatch]
devices = []
arch = []
require = []

[mmrl.repo.options.archive]
compression = ""

[kam]
min_api = 0
max_api = 0
supported_arch = []
conflicts = []
module_type = "template"

[kam.build]
target_dir = "../../src/assets/tmpl"
output_file = "tmpl_template"
hooks_dir = "hooks"
exclude = ["src/tmpl_template/"]

[kam.tmpl.variables.repository]
var_type = "string"
required = false
default = ""
note = "GitHub repository URL (optional)"
help = "The GitHub repository URL where your template source code is hosted"
example = "https://github.com/user/repo"

[kam.tmpl.variables.example]
var_type = "string"
required = true
default = ""
note = "Example variable for demonstration"
help = "This is an example variable that demonstrates how to define required template variables"
example = "example_value"

[kam.workspace]
members = ["."]

[dev.sync]
stage_dir = "/data/local/tmp/kam-dev/{{id}}"
mirror = ["webroot/**"]
preserve = [".config/**", "config.yaml", "config.yml", "subscriptions/**", "*.user.yaml", "*.user.yml"]
ignore = ["logs/**", ".log/**", "cache/**", "*.bak", "*.kam-tmp"]

[tool]
