[prop]
id = "ak3_template"
name = "AnyKernel3 Template"
version = "0.1.0"
versionCode = 1  # Will be auto-generated as timestamp during initialization
author = "LightJunction"
description = "A Kam template for creating AnyKernel3 flashable zip modules"
updateJson = ""
metamodule = false

[mmrl.repo]
license = "MIT"
license_file = "LICENSE"
homepage = ""
readme = ""
readme_file = "README.md"
changelog = ""
changelog_file = "CHANGELOG.md"
screenshots = []
categories = ["tools"]
keywords = [
    "kam",
    "template",
    "android",
    "anykernel3",
    "kernel",
]
maintainers = []
repository = ""
documentation = ""
issues = ""
funding = "https://github.com/sponsors/LightJunction"
support = ""
donate = ""
cover = ""
icon = "icon.png"
devices = []
arch = ["arm64-v8a"]
require = []
antifeatures = []
max_num = 0
min_api = 21
max_api = 35
verified = false
features = ["kernel-flashing", "anykernel3"]

[mmrl.repo.note]
title = ""
message = ""

[mmrl.repo.manager.magisk]
devices = []
arch = []
require = []

[mmrl.repo.manager.kernelsu]
devices = []
arch = []
require = []

[mmrl.repo.manager.apatch]
devices = []
arch = []
require = []

[mmrl.repo.options.archive]
compression = ""

[kam]
min_api = 0
max_api = 0
supported_arch = []
conflicts = []
module_type = "template"

[kam.build]
source_dir = "src/AnyKernel3"
target_dir = "../../templates/"
output_file = "ak3_template"
hooks_dir = "hooks"
include = [".kam/bases.toml"]

[kam.tmpl.variables.repository]
var_type = "string"
required = false
default = ""
note = "GitHub repository URL (optional)"
help = "The GitHub repository URL where your module source code is hosted"
example = "https://github.com/user/repo"

[kam.workspace]
members = ["."]

[tool]
