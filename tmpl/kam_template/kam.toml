[prop]
id = "kam_template"
version = "0.1.0"
versionCode = 1762850845388
author = "{{author}}"
name = "{{project_name}}"
description = "{% if description %}{{description}}{% else %}A Magisk/KernelSU module created with Kam{% endif %}"
updateJson = "{{update_json}}"

[mmrl.repo]
license = "MIT"
license_file = "LICENSE"
homepage = "{% if repository %}{{repository}}{% else %}https://github.com/{{author}}/{{prop.id}}{% endif %}"
readme = "{% if repository %}{{repository}}/blob/main/README.md{% else %}https://github.com/{{author}}/{{prop.id}}/blob/main/README.md{% endif %}"
readme_file = "README.md"
changelog = "{% if repository %}{{repository}}/blob/main/CHANGELOG.md{% else %}https://github.com/{{author}}/{{prop.id}}/blob/main/CHANGELOG.md{% endif %}"
changelog_file = "CHANGELOG.md"
screenshots = []
categories = ["tools"]
keywords = ["kam", "module", "android", "template"]
maintainers = ["{{author}}"]
repository = "{% if repository %}{{repository}}{% else %}https://github.com/{{author}}/{{prop.id}}{% endif %}"
documentation = "{% if repository %}{{repository}}{% else %}https://github.com/{{author}}/{{prop.id}}{% endif %}"
issues = "{% if repository %}{{repository}}/issues{% else %}https://github.com/{{author}}/{{prop.id}}/issues{% endif %}"
funding = "https://github.com/sponsors/{{author}}"
support = "{% if repository %}{{repository}}/issues{% else %}https://github.com/{{author}}/{{prop.id}}/issues{% endif %}"
donate = ""
cover = ""
icon = "icon.png"
devices = []
arch = ["arm64-v8a"]
require = []
antifeatures = []
max_num = 0
min_api = 21
max_api = 35
verified = false
features = ["module-template", "customization"]

[mmrl.repo.note]
title = ""
message = ""

[mmrl.repo.manager.magisk]
devices = []
arch = []
require = []

[mmrl.repo.manager.kernelsu]
devices = []
arch = []
require = []

[mmrl.repo.manager.apatch]
devices = []
arch = []
require = []

[mmrl.repo.options.archive]
compression = ""

[kam]
min_api = 0
max_api = 0
supported_arch = []
conflicts = []
module_type = "template"

[kam.build]
target_dir = "../../templates/"
output_file = "kam_template"
hooks_dir = "hooks"
exclude = ["src/kam_template/"]

[kam.tmpl.variables]
[kam.tmpl.variables.repository]
var_type = "string"
required = false
default = ""

[kam.workspace]
members = ["."]

[tool]
