name: Validate Kam Module

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kam-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@v3
        with:
          github-token: ${{ github.token }}
          enable-cache: 'true'
          cache-targets: cargo,kam
          install-commitizen: 'false'
          warn-private-key: 'false'

      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq python3-yaml

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          kam validate
          kam check

      - name: Test downloader template
        shell: bash
        run: |
          set -euo pipefail
          (cd tmpl/downloader_template/downloader && go test ./...)
          kam validate tmpl/downloader_template
          kam build tmpl/downloader_template --quiet
          kam init "$RUNNER_TEMP/downloader-smoke" \
            -t templates/downloader_template.tar.gz \
            --id downloader_smoke --project-name 'Downloader Smoke' \
            --author Kam --version 1.0.0 \
            --var target_repository=MemDeco-WG/Kam \
            --var target_asset=Kam.zip --var target_module=Kam
          kam validate "$RUNNER_TEMP/downloader-smoke"
          kam build "$RUNNER_TEMP/downloader-smoke" --quiet
          unzip -t "$RUNNER_TEMP/downloader-smoke/dist/downloader_smoke.zip"
