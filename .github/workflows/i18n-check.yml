name: CLI i18n checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  i18n-check:
    name: Export CLI i18n and verify localized help output
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Export CLI i18n JSON for WEB UI
        # Generate CLI JSON files from src/i18n/{en,zh}.toml and write them to
        # Kam/KamWEBUI/src/data/cli/{en,zh}.json
        run: |
          python3 Kam/scripts/export_cli_i18n.py

      - name: Report missing CLI i18n keys (skeleton scan)
        # This checks for missing translation keys discovered by scanning src/cmds.
        # Currently this reports missing keys but does not fail the CI (non-fatal).
        run: |
          set +e
          python3 Kam/scripts/generate_cli_i18n_skeleton.py --check
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "WARNING: Missing CLI i18n keys detected (non-fatal). Run 'python3 Kam/scripts/generate_cli_i18n_skeleton.py --write' to produce skeletons for review."
          fi
          set -e

      - name: Ensure generated CLI i18n files are committed
        # If the script modified those files (i.e. exported output is not in repo),
        # fail and show diff so contributors can commit the generated output.
        run: |
          set -e
          git --no-pager diff --exit-code --quiet -- Kam/KamWEBUI/src/data/cli || {
            echo "Generated CLI i18n files are out of date. Run:"
            echo "  python3 Kam/scripts/export_cli_i18n.py"
            echo "and commit the changes to Kam/KamWEBUI/src/data/cli/*"
            echo
            echo "Diff of generated changes:"
            git --no-pager diff -- Kam/KamWEBUI/src/data/cli || true
            exit 1
          }

      - name: Install Rust toolchain (stable)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build the CLI (release)
        working-directory: Kam
        run: |
          set -e
          cargo build --release

      - name: Verify `kam build --help` is localized (zh)
        working-directory: Kam
        env:
          KAM_UI_LANGUAGE: zh
        run: |
          set -e
          KAM_UI_LANGUAGE=zh ./target/release/kam build --help | tee /tmp/kam_build_help_zh.txt
          echo "=== Help output (zh) ==="
          sed -n '1,200p' /tmp/kam_build_help_zh.txt || true
          if ! grep -F "构建并打包模块为可分发的 ZIP 工件" /tmp/kam_build_help_zh.txt; then
            echo "ERROR: Expected Chinese summary for 'build' not found in help output."
            exit 1
          fi
          if ! grep -F "输出目录（默认：dist）" /tmp/kam_build_help_zh.txt; then
            echo "ERROR: Expected Chinese flag description for --output not found in help output."
            exit 1
          fi

      - name: Verify `kam build --help` is localized (en)
        working-directory: Kam
        env:
          KAM_UI_LANGUAGE: en
        run: |
          set -e
          KAM_UI_LANGUAGE=en ./target/release/kam build --help | tee /tmp/kam_build_help_en.txt
          echo "=== Help output (en) ==="
          sed -n '1,200p' /tmp/kam_build_help_en.txt || true
          if ! grep -F "Build and package a module into a deployable ZIP artifact" /tmp/kam_build_help_en.txt; then
            echo "ERROR: Expected English summary for 'build' not found in help output."
            exit 1
          fi
          if ! grep -F "Output directory (default: dist)" /tmp/kam_build_help_en.txt; then
            echo "ERROR: Expected English flag description for --output not found in help output."
            exit 1
          fi

      - name: Verify nested subcommand help is localized (tmpl import, zh)
        working-directory: Kam
        env:
          KAM_UI_LANGUAGE: zh
        run: |
          set -e
          KAM_UI_LANGUAGE=zh ./target/release/kam tmpl import --help | tee /tmp/kam_tmpl_import_help_zh.txt
          echo "=== tmpl import help (zh) ==="
          sed -n '1,200p' /tmp/kam_tmpl_import_help_zh.txt || true
          if ! grep -F "从文件导入模板" /tmp/kam_tmpl_import_help_zh.txt; then
            echo "ERROR: Expected Chinese summary for 'tmpl import' not found in help output."
            exit 1
          fi

      - name: Success - i18n checks passed
        if: success()
        run: echo "CLI i18n export and localized help checks passed."
