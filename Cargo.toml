[dependencies]
base64 = "0.22.1"
clap_complete = "4.2.4"
colored = "3.0.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
flate2 = "1.1.5"
git2 = "0.20.3"
glob = "0.3.3"
hex = "0.4.3"
hmac = "0.12"
ignore = "0.4.25"
indicatif = "0.18.3"
keyring = "3.6.3"
rand = "0.9.2"
rcgen = "0.14.5"
regex = "1.12.2"
rpassword = "7.0"
rust-embed = "8.9.0"
serde_json = "1.0.145"
serde_yaml = "0.9.33"
sha2 = "0.10"
sigstore-sign = "0.6.0"
sigstore-tsa = "0.6.0"
sigstore-types = "0.6.0"
tar = "0.4.44"
tempfile = "3"
tera = "1.20"
terminal_size = "0.2"
thiserror = "2.0"
toml = "0.9.8"
tree-sitter = "0.26.2"
tree-sitter-bash = "0.25.1"
walkdir = "2.3.3"
zip = "6.0.0"

[dependencies.chrono]
features = ["serde"]
version = "0.4"

[dependencies.clap]
features = ["derive"]
version = "4.5.51"

[dependencies.openssl]
features = ["vendored"]
version = "0.10"

[dependencies.reqwest]
features = [
    "blocking",
    "rustls-tls",
]
version = "0.12.25"

[dependencies.serde]
features = ["derive"]
version = "1.0.228"

[dependencies.tokio]
features = [
    "rt",
    "macros",
]
version = "1.39"

[dependencies.toml_edit]
features = ["serde"]
version = "0.23.7"

[dev-dependencies]
serial_test = "3.2.0"

[package]
authors = ["LightJunction"]
categories = [
    "command-line-utilities",
    "development-tools",
]
description = "A lightweight, networkless CLI for scaffolding and packaging Magisk/Kernelsu/APU/Anykernel3/Astrbot/... modules."
documentation = "https://github.com/MemDeco-WG/Kam/blob/main/README.md"
edition = "2024"
exclude = [
    "target",
    "hooks",
    "ModuleWebUI",
    "dist",
    "/tmpl",
    "templates",
    "src/Kam",
]
homepage = "https://github.com/MemDeco-WG/Kam"
keywords = [
    "magisk",
    "kernelsu",
    "android",
    "module",
    "cli",
]
license = "GPL-3.0"
name = "kam"
repository = "https://github.com/MemDeco-WG/Kam"
version = "0.4.14"
