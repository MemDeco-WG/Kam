[package]
name = "kam"
version = "0.6.0"
edition = "2024"
description = "A Powerful CLI for scaffolding and packaging Magisk/Kernelsu/APU/Anykernel3/... modules."
documentation = "https://github.com/MemDeco-WG/Kam/blob/main/README.md"
homepage = "https://github.com/MemDeco-WG/Kam"
repository = "https://github.com/MemDeco-WG/Kam"
license = "GPL-3.0"
keywords = ["ap", "cli", "kernelsu", "magisk"]
# `package.authors` is deprecated; moved to `package.metadata.authors`
# authors = ["LightJunction"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  "/tmpl",
  "ModuleWebUI",
  "dist",
  "hooks",
  "src/Kam",
  "target",
  "templates",
]

[package.metadata]
authors = ["LightJunction"]

[dependencies]
base64 = "0.22.1"
clap_complete = "4.5.62"
colored = "3.0.0"
comfy-table = "7.2.1"
crossbeam-channel = "0.5"
dialoguer = "0.12.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
flate2 = "1.1.5"
fluent = "0.17.0"
fluent-bundle = "0.16.0"
fluent-templates = "0.13.2"
unic-langid = "0.9"
git2 = "0.20.3"
glob = "0.3.3"
hex = "0.4.3"
hmac = "0.12"
http = "1.4.0"
ignore = "0.4.25"
keyring = "3.6.3"
lazy_static = "1.5.0"
rand = "0.9.2"
rcgen = "0.14.6"
regex = "1.12.2"
rpassword = "7.4.0"
rust-embed = "8.9.0"
semver = "1.0"
serde_json = "1.0.148"
serde_yaml = "0.9.33"
sha2 = "0.10"
sigstore-sign = "0.6.0"
sigstore-tsa = "0.6.0"
sigstore-types = "0.6.0"
sysinfo = "0.37.2"
tar = "0.4.44"
tempfile = "3"
tera = "1.20"
terminal_size = "0.4.3"
thiserror = "2.0"
toml = "0.9.8"
tree-sitter = "0.26.3"
tree-sitter-bash = "0.25.1"
walkdir = "2.5.0"
x509-parser = "0.18.0"
zeroize = "1.8.2"
zip = "7.0.0"

[dependencies.chrono]
version = "0.4.42"
features = ["serde"]

[dependencies.clap]
version = "4.5.53"
features = ["derive"]

[dependencies.indicatif]
version = "0.18.3"
default-features = false
features = ["unicode-width"]

[dependencies.openssl]
version = "0.10"
features = ["vendored"]

[dependencies.reqwest]
version = "0.12.28"
features = ["blocking", "json", "rustls-tls"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.sys-locale]
version = "0.3"
optional = true

[dependencies.tokio]
version = "1.48"
features = ["macros", "rt"]

[dependencies.toml_edit]
version = "0.24.0"
features = ["serde"]

[dev-dependencies]
serial_test = "3.2.0"

[build-dependencies]
regex = "1"

[features]
default = []
sys-locale = ["dep:sys-locale"]

[profile.release]
opt-level = "z"
debug = false
lto = "fat"
panic = "abort"
codegen-units = 1
