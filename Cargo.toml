[package]
name = "kam"
version = "0.1.0"
edition = "2024"
description = "A CLI tool for managing Magisk/KernelSU modules with built-in template support, build hooks, and workspace management"
license = "GPL-3.0"
repository = "https://github.com/MemDeco-WG/Kam"
homepage = "https://github.com/MemDeco-WG/Kam"
documentation = "https://github.com/MemDeco-WG/Kam/blob/main/README.md"
keywords = ["magisk", "kernelsu", "android", "module", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["LightJunction"]

exclude = [
    "target",
    "hooks",
    "ModuleWebUI",
    "dist",
    "/tmpl",
    "src/Kam",
    "templates"
]


[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
rand = "0.9.2"
regex = "1.12.2"
toml_edit = { version = "0.23.7", features = ["serde"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

tempfile = "3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rust-embed = "8.9.0"
toml = "0.9.8"
colored = "3.0.0"
dotenvy = "0.15.7"
flate2 = "1.1.5"
tar = "0.4.44"
walkdir = "2.3.3"
zip = "6.0.0"
ignore = "0.4.25"
serde_yaml = "0.9.34"
glob = "0.3.3"
tera = "1.20"
dirs = "6.0.0"
indicatif = "0.17"

[dev-dependencies]
