# CLI 本地化（用于 `kam --help` 以及子命令帮助文本）
[cli]
about = "Kam — Kam 是一个用于脚手架、构建、打包与分发 Android 模块与模板（ksu/APU/Magisk/AnyTemplate）的命令行工具。支持项目初始化、打包、模板管理与仓库元数据导出。"
long_about = "Kam 提供从模板初始化项目、构建与打包模块、管理模板与缓存、导出项目元数据等功能。使用 `kam help <COMMAND>` 查看子命令的详细帮助信息。"

# 全局选项（顶层）
[cli.flags]
help = "打印帮助（参考 '-h'）"
version = "打印版本"

# -------------------------
# init
# -------------------------
[cli.commands.init]
summary = "从模板初始化一个新的 Kam 项目（支持 meta 与 kernel 模板）"
description = "以交互或非交互方式从本地或内置模板创建新项目，并可预填常见元数据。"

[cli.commands.init.flags]
name = "项目路径（在交互模式下可留空以交互填写）"
id = "模块 ID（默认为目录名）"
project_name = "项目名称（默认示例：Example Module Name）"
version = "项目版本（默认：1.0.0）"
author = "作者姓名"
update_json = "Update JSON 的 URL（默认：从 git 自动生成）"
description = "项目描述"
force = "强制覆盖已存在的文件"
interactive = "以交互模式运行并提示必填项"
var = "模板变量，key=value 格式（可重复）"
template = "要使用的模板（内置 ID 或本地路径）"
tmpl = "创建模板项目"

# -------------------------
# build
# -------------------------
[cli.commands.build]
summary = "构建并打包模块为可分发的 ZIP 工件"
description = "构建项目并在输出目录生成工件，支持工作区并行构建与签名等选项。"

[cli.commands.build.flags]
path = "项目路径（默认：当前目录）"
all = "构建所有工作区成员"
output = "输出目录（默认：dist）"
bump = "启用版本自动 bump（KAM_BUMP_ENABLED）"
release = "启用发布构建（KAM_RELEASE_ENABLED）"
sign = "构建后进行签名（KAM_SIGN_ENABLE）"
interactive = "以交互模式运行构建；对破坏性操作进行确认"
pre_release = "启用预发布模式"
quiet = "减少输出，仅显示警告与错误"
jobs = "并行作业数（默认：CPU 核心数）"

# -------------------------
# version
# -------------------------
[cli.commands.version]
summary = "管理模块版本与 bump 策略"

# -------------------------
# cache
# -------------------------
[cli.commands.cache]
summary = "管理本地模板与工件缓存"
description = "列出、添加、删除或清理缓存的模板，并可显示缓存路径。"

[cli.commands.cache.list]
summary = "列出已缓存的模板"

[cli.commands.cache.clean]
summary = "清理所有缓存的模板"

[cli.commands.cache.add]
summary = "从本地目录或归档添加模板到缓存"
[cli.commands.cache.add.flags]
name = "要注册的模板名称"
path = "模板源路径（目录或归档）"

[cli.commands.cache.remove]
